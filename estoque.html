<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estoque | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<script>
    const user = JSON.parse(localStorage.getItem('sf_user'));
    if (!user || user.email !== "admin@samuel.com") {
        window.location.href = 'index.html';
    }
</script>

<div class="container">
    <h2>📦 Gerenciar Estoque</h2>
    <div class="card" style="margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="t" placeholder="Nome do Produto">
        <input type="number" id="p" placeholder="Preço">
        <input type="number" id="q" placeholder="Quantidade">
        <input type="text" id="img" placeholder="Link da Imagem">
        <button class="btn btn-buy" onclick="add()" style="width:auto">Adicionar</button>
        <button class="btn" onclick="limparTudo()" style="width:auto; background:#ef4444; color:white">Resetar Banco</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Qtd</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>
</div>

<script>
    function render() {
        const produtos = JSON.parse(localStorage.getItem('sf_estoque')) || [];
        document.getElementById('lista').innerHTML = produtos.map((p, i) => `
            <tr>
                <td>${p.titulo}</td>
                <td>R$ ${p.preco.toFixed(2)}</td>
                <td style="font-weight:bold; color:${p.qtd <= 0 ? 'red' : 'green'}">${p.qtd}</td>
                <td><button onclick="remover(${i})">Remover</button></td>
            </tr>
        `).join('');
    }

    function add() {
        const nt = document.getElementById('t').value;
        const np = document.getElementById('p').value;
        const nq = document.getElementById('q').value;
        const ni = document.getElementById('img').value || 'https://via.placeholder.com/150';

        if(!nt || !np || !nq) return alert("Preencha tudo!");

        let produtos = JSON.parse(localStorage.getItem('sf_estoque')) || [];
        produtos.push({
            id: Date.now(),
            titulo: nt,
            preco: parseFloat(np),
            qtd: parseInt(nq), // NOME PADRÃO: qtd
            img: ni
        });

        localStorage.setItem('sf_estoque', JSON.stringify(produtos));
        location.reload();
    }

    function remover(i) {
        let produtos = JSON.parse(localStorage.getItem('sf_estoque'));
        produtos.splice(i, 1);
        localStorage.setItem('sf_estoque', JSON.stringify(produtos));
        render();
    }

    function limparTudo() {
        if(confirm("Isso vai apagar TODOS os produtos para corrigir o erro. Deseja continuar?")) {
            localStorage.removeItem('sf_estoque');
            location.reload();
        }
    }
    render();
</script>
</body>
</html>
