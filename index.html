<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Fashion | Oficial 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000; --secondary: #64748b; --bg: #f8fafc;
            --card-bg: #ffffff; --accent: #10b981; --text: #0f172a;
            --border: #e2e8f0; --header-bg: rgba(255, 255, 255, 0.85);
        }
        body.dark-theme {
            --bg: #0f172a; --card-bg: #1e293b; --primary: #ffffff;
            --secondary: #94a3b8; --text: #f1f5f9; --border: #334155;
            --header-bg: rgba(15, 23, 42, 0.9);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text); transition: 0.3s; overflow-x: hidden; }

        /* HEADER & NAV */
        header {
            padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center;
            background: var(--header-bg); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 800; font-size: 1.4rem; cursor: pointer; text-transform: uppercase; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .btn-icon { 
            background: var(--primary); color: var(--bg); border: none; 
            padding: 10px 18px; border-radius: 50px; cursor: pointer; font-weight: 600; 
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }

        /* LOGIN MODAL */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 3000; display: none; align-items: center; justify-content: center;
        }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .input-group input { padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }

        /* GRID & CARDS */
        .hero { padding: 4rem 5% 2rem; text-align: center; }
        #searchInput { width: 100%; max-width: 600px; padding: 1.2rem; border-radius: 50px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 3rem; flex-wrap: wrap; }
        .filter-btn { padding: 8px 20px; border: 1px solid var(--border); background: var(--card-bg); border-radius: 50px; cursor: pointer; font-weight: 600; color: var(--text); }
        .filter-btn.active { background: var(--primary); color: var(--bg); }

        .brand-section { max-width: 1300px; margin: 0 auto 3rem; padding: 0 5%; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        
        .card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: 0.3s; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .img-box { height: 280px; background: #f1f5f9; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .price { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .btn-buy { background: var(--primary); color: var(--bg); border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* CART DRAWER */
        #cart { position: fixed; top: 0; right: -450px; width: 100%; max-width: 400px; height: 100%; background: var(--card-bg); z-index: 2000; transition: 0.4s; padding: 25px; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        #cart.active { right: 0; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 20px 0; }
        .ship-box { background: var(--bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px dashed var(--secondary); font-size: 0.8rem; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 1500; backdrop-filter: blur(4px); }
        #overlay.active { display: block; }
    </style>
</head>
<body>

<div id="overlay" onclick="closeAll()"></div>

<div id="loginModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Entrar</h2>
        <div class="input-group">
            <input type="text" id="userName" placeholder="Nome Completo" style="display:none">
            <input type="email" id="userEmail" placeholder="E-mail">
            <input type="password" id="userPass" placeholder="Senha">
            <button class="btn-buy" onclick="handleAuth()">Confirmar</button>
            <p id="switchAuth" style="text-align:center; font-size:0.8rem; cursor:pointer; color:var(--secondary)" onclick="toggleAuthMode()">Não tem conta? Cadastre-se</p>
        </div>
        <button onclick="closeAll()" style="width:100%; background:none; border:none; color:var(--secondary)">Fechar</button>
    </div>
</div>

<header>
    <div class="logo">Samuel Fashion</div>
    <div class="nav-right">
        <div id="userLabel" style="font-weight:600; cursor:pointer" onclick="openLogin()">👤 Fazer Login</div>
        <button class="btn-icon" onclick="toggleCart()">🛒 <span id="count">0</span></button>
    </div>
</header>

<div id="cart">
    <h2>Carrinho</h2>
    <div class="cart-items" id="cartList"></div>
    <div class="ship-box">
        <b>Calcular Frete:</b>
        <div style="display:flex; gap:5px; margin-top:5px">
            <input type="text" id="cep" placeholder="00000-000" style="flex:1; padding:5px; border-radius:5px; border:1px solid var(--border)">
            <button onclick="calcShip()" style="padding:5px 10px; border-radius:5px; border:none; background:var(--secondary); color:white">Calcular</button>
        </div>
        <div id="shipRes" style="margin-top:5px; color:var(--accent); font-weight:700"></div>
    </div>
    <div style="font-size:1.2rem; font-weight:800; border-top:1px solid var(--border); padding-top:10px">
        Total: <span id="cartTotal">R$ 0,00</span>
    </div>
    <button class="btn-buy" style="margin-top:15px" onclick="finish()">Finalizar Compra</button>
</div>

<section class="hero">
    <h1>Coleção 2026</h1>
    <input type="text" id="searchInput" placeholder="Busque por marca, cor ou estilo...">
</section>

<div class="filters">
    <button class="filter-btn active" onclick="filter('todos', this)">Todos</button>
    <button class="filter-btn" onclick="filter('nike', this)">Nike</button>
    <button class="filter-btn" onclick="filter('adidas', this)">Adidas</button>
    <button class="filter-btn" onclick="filter('lacoste', this)">Lacoste</button>
    <button class="filter-btn" onclick="filter('penalty', this)">Penalty</button>
    <button class="filter-btn" onclick="filter('shein', this)">Shein</button>
</div>

<main id="container"></main>

<script>
    // LISTA COMPLETA DOS SEUS PRODUTOS
    const produtos = [
        { id: 1, marca: 'nike', titulo: "Air Force 1 Branco", preco: 759.99, img: "https://imgnike-a.akamaihd.net/768x768/01113751A2.jpg" },
        { id: 2, marca: 'nike', titulo: "Moletom Sportswear Club", preco: 284.99, img: "https://imgnike-a.akamaihd.net/1024x1024/0957727TA2.jpg" },
        { id: 3, marca: 'nike', titulo: "Dunk Low 'Panda'", preco: 854.99, img: "https://imgnike-a.akamaihd.net/1920x1920/05847553A2.jpg" },
        { id: 4, marca: 'nike', titulo: "Tênis Nike TN Blue", preco: 1329.99, img: "https://imgnike-a.akamaihd.net/768x768/022147IHA2.jpg" },
        { id: 5, marca: 'adidas', titulo: "Tênis Ultraboost 5", preco: 1099.99, img: "https://assets.adidas.com/images/w_600,f_auto,q_auto/a284c05789e64be281506dbda3204ed0_9366/Tenis_Ultraboost_5_Turquesa_JQ2911_HM1.jpg" },
        { id: 6, marca: 'adidas', titulo: "Superstar Originals", preco: 599.99, img: "https://assets.adidas.com/images/w_600,f_auto,q_auto/19bb876160da48f9b261741f4512ea9f_9366/Tenis_SUPERSTAR_ST_Cinza_KI4208_00_plp_standard.jpg" },
        { id: 7, marca: 'adidas', titulo: "Camisa Real Madrid 25/26", preco: 399.99, img: "https://assets.adidas.com/images/h_2000,f_auto,q_auto/6781a185b37a4e508590bf5c35993725_9366/Camisa_III_Real_Madrid_25-26_Azul_JV5845_01_laydown.jpg" },
        { id: 8, marca: 'lacoste', titulo: "Camisa Polo L1212", preco: 699.00, img: "https://imagesa1.lacoste.com/dw/image/v2/BCWL_PRD/on/demandware.static/-/Sites-master/default/dwc5ccbfaf/L1212_HBP_24.jpg?imwidth=960" },
        { id: 9, marca: 'lacoste', titulo: "Tênis Lineshot Couro", preco: 929.00, img: "https://imagesa1.lacoste.com/dw/image/v2/BCWL_PRD/on/demandware.static/-/Sites-master/default/dweba3204a/48SMA0026_AAT_01.jpg?imwidth=960" },
        { id: 10, marca: 'penalty', titulo: "Bola Penalty S11", preco: 599.99, img: "https://cambuci.vtexassets.com/arquivos/ids/1505567-1200-auto" },
        { id: 11, marca: 'penalty', titulo: "Chuteira Society Storm", preco: 269.99, img: "https://cambuci.vtexassets.com/arquivos/ids/1555564-1200-auto" },
        { id: 12, marca: 'shein', titulo: "Vestido Floral Verão", preco: 159.99, img: "https://images.unsplash.com/photo-1572804013307-a9a11117bb41?q=80&w=400" },
        { id: 13, marca: 'shein', titulo: "Cropped Manga Longa", preco: 89.99, img: "https://images.unsplash.com/photo-1554568218-0f1715e72254?q=80&w=400" },
        { id: 14, marca: 'shein', titulo: "Tênis Chunky Feminino", preco: 199.99, img: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=400" }
    ];

    let carrinho = JSON.parse(localStorage.getItem('sf_cart')) || [];
    let logado = JSON.parse(localStorage.getItem('sf_user')) || null;
    let modoRegistro = false;
    let valorFrete = 0;

    // RENDERIZAR PRODUTOS
    function render(lista = produtos) {
        const main = document.getElementById('container');
        main.innerHTML = '';
        const marcas = [...new Set(lista.map(p => p.marca))];

        marcas.forEach(marca => {
            const sec = document.createElement('section');
            sec.className = 'brand-section';
            sec.innerHTML = `<h2 style="margin-bottom:20px">${marca.toUpperCase()}</h2><div class="product-grid" id="grid-${marca}"></div>`;
            main.appendChild(sec);
            const grid = document.getElementById(`grid-${marca}`);
            lista.filter(p => p.marca === marca).forEach(p => {
                grid.innerHTML += `
                <div class="card">
                    <div class="img-box"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/300'"></div>
                    <div class="info">
                        <h3>${p.titulo}</h3>
                        <div class="price">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
                        <button class="btn-buy" onclick="add(${p.id})">Adicionar ao Carrinho</button>
                    </div>
                </div>`;
            });
        });
        updateUI();
    }

    // LOGIN & CADASTRO
    function openLogin() {
        if(logado) { if(confirm("Deseja sair da conta?")) { localStorage.removeItem('sf_user'); location.reload(); } }
        else { document.getElementById('loginModal').style.display = 'flex'; document.getElementById('overlay').classList.add('active'); }
    }

    function toggleAuthMode() {
        modoRegistro = !modoRegistro;
        document.getElementById('modalTitle').innerText = modoRegistro ? "Criar Conta" : "Entrar";
        document.getElementById('userName').style.display = modoRegistro ? "block" : "none";
        document.getElementById('switchAuth').innerText = modoRegistro ? "Já tem conta? Entre" : "Não tem conta? Cadastre-se";
    }

    function handleAuth() {
        const email = document.getElementById('userEmail').value;
        const pass = document.getElementById('userPass').value;
        const name = document.getElementById('userName').value;
        if(!email || !pass) return alert("Preencha tudo!");

        let usuarios = JSON.parse(localStorage.getItem('sf_users_db')) || [];

        if(modoRegistro) {
            usuarios.push({name, email, pass});
            localStorage.setItem('sf_users_db', JSON.stringify(usuarios));
            alert("Cadastrado! Agora entre.");
            toggleAuthMode();
        } else {
            const u = usuarios.find(x => x.email === email && x.pass === pass);
            if(u) { localStorage.setItem('sf_user', JSON.stringify(u)); location.reload(); }
            else alert("Dados incorretos!");
        }
    }

    // CARRINHO & FRETE
    function add(id) {
        const p = produtos.find(x => x.id === id);
        carrinho.push(p);
        localStorage.setItem('sf_cart', JSON.stringify(carrinho));
        updateUI();
    }

    function calcShip() {
        const c = document.getElementById('cep').value;
        if(c.length < 8) return alert("CEP inválido");
        valorFrete = c.startsWith('0') || c.startsWith('1') ? 15.00 : 35.00;
        document.getElementById('shipRes').innerText = `Frete: R$ ${valorFrete.toFixed(2)}`;
        updateUI();
    }

    function updateUI() {
        const list = document.getElementById('cartList');
        list.innerHTML = '';
        let subtotal = 0;
        carrinho.forEach((item, index) => {
            subtotal += item.preco;
            list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.8rem">
                <span>${item.titulo}</span>
                <button onclick="remove(${index})" style="background:none; border:none; cursor:pointer">🗑️</button>
            </div>`;
        });
        document.getElementById('count').innerText = carrinho.length;
        document.getElementById('cartTotal').innerText = `R$ ${(subtotal + valorFrete).toFixed(2)}`;
        if(logado) document.getElementById('userLabel').innerText = `Olá, ${logado.name.split(' ')[0]}`;
    }

    function remove(i) {
        carrinho.splice(i, 1);
        localStorage.setItem('sf_cart', JSON.stringify(carrinho));
        updateUI();
    }

    function toggleCart() {
        document.getElementById('cart').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function closeAll() {
        document.getElementById('cart').classList.remove('active');
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('overlay').classList.remove('active');
    }

    function finish() {
        if(!logado) { alert("Faça login para finalizar!"); openLogin(); }
        else alert("Pedido simulado com sucesso!");
    }

    // BUSCA
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const t = e.target.value.toLowerCase();
        const filtrados = produtos.filter(p => p.titulo.toLowerCase().includes(t) || p.marca.toLowerCase().includes(t));
        render(filtrados);
    });

    render();
</script>
</body>
</html>
