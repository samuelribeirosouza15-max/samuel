<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo - Satélite em Português</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #000; }
        #map { height: 100vh; width: 100vw; }

        /* Painel de Informações */
        #painel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: 'Segoe UI', Arial, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Estilo para a barra de busca em português */
        .leaflet-control-geocoder-form input {
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="painel">
        <h2 style="margin:0; color: #1a73e8; font-size: 1.3rem;">Olá Mundo Maps</h2>
        <p style="margin:5px 0 0 0; font-size: 0.85rem; color: #555;">Use a lupa para buscar seu endereço</p>
    </div>

    <div id="map"></div>

    <script>
        // 1. Camada de Imagem de Satélite
        var satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Imagens © Esri'
        });

        // 2. Camada de Nomes (Cidades, Ruas e Fronteiras)
        var nomes = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Nomes © Esri'
        });

        // 3. Inicializa o mapa (Focado no Brasil por padrão)
        var map = L.map('map', {
            center: [-15.7942, -47.8822], // Coordenadas de Brasília
            zoom: 4,
            layers: [satelite, nomes] // Ativa satélite e nomes juntos
        });

        // 4. Controle de camadas no canto superior direito
        var opcoesMapas = {
            "Mostrar Nomes das Ruas": nomes
        };
        // Adiciona o seletor traduzido
        L.control.layers(null, opcoesMapas, { 
            collapsed: false,
            position: 'topright' 
        }).addTo(map);

        // 5. Configura a barra de busca em Português
        var buscador = L.Control.geocoder({
            defaultMarkGeocode: true,
            placeholder: "Pesquisar lugar...",
            errorMessage: "Local não encontrado.",
            showUniqueResult: true
        }).addTo(map);

        // Ajuste automático de carregamento
        setTimeout(() => { map.invalidateSize(); }, 500);
    </script>
</body>
</html>
