<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogo 3D Simples</title>
<style>
  body { margin:0; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Luz
let light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10,10,10);
scene.add(light);

// Cubo (player)
let geometry = new THREE.BoxGeometry();
let material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
let player = new THREE.Mesh(geometry, material);
scene.add(player);
player.position.y = 0.5;

// Plataforma
let planeGeometry = new THREE.PlaneGeometry(20,20);
let planeMaterial = new THREE.MeshStandardMaterial({color:0x555555});
let plane = new THREE.Mesh(planeGeometry, planeMaterial);
plane.rotation.x = -Math.PI/2;
scene.add(plane);

// Câmera
camera.position.z = 5;
camera.position.y = 5;
camera.lookAt(0,0,0);

// Movimentação
let move = { left:false, right:false };
document.addEventListener('keydown', e => {
  if(e.key==='a') move.left = true;
  if(e.key==='d') move.right = true;
});
document.addEventListener('keyup', e => {
  if(e.key==='a') move.left = false;
  if(e.key==='d') move.right = false;
});

function animate() {
  requestAnimationFrame(animate);
  if(move.left) player.position.x -= 0.1;
  if(move.right) player.position.x += 0.1;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
