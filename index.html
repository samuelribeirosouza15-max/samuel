<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tiro Pixel</title>
<style>
  body { margin:0; overflow:hidden; background:#222; }
  #gameCanvas { display:block; margin:0 auto; background:#111; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x:280, y:350, width:40, height:40, speed:5 };
let bullets = [];
let enemies = [];
let score = 0;
let lives = 3;

// Criar inimigos aleatórios
function spawnEnemy() {
  let x = Math.random() * (canvas.width - 40);
  enemies.push({ x:x, y:0, width:40, height:40, speed:2 + Math.random() * 2 });
}
setInterval(spawnEnemy, 2000);

function drawPlayer() {
  ctx.fillStyle = 'cyan';
  ctx.fillRect(player.x, player.y, player.width, player.height);
}

function drawBullets() {
  ctx.fillStyle = 'yellow';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
}

function drawEnemies() {
  ctx.fillStyle = 'red';
  enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));
}

function drawUI() {
  ctx.fillStyle = 'white';
  ctx.font = '20px Arial';
  ctx.fillText(`Pontuação: ${score}`, 10, 20);
  ctx.fillText(`Vidas: ${lives}`, 500, 20);
}

function update() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Atualizar balas
  bullets.forEach((b,i) => {
    b.y -= 7;
    // remover balas fora da tela
    if(b.y < 0) bullets.splice(i,1);
  });

  // Atualizar inimigos
  enemies.forEach((e,j) => {
    e.y += e.speed;
    // Colisão com jogador
    if(e.x < player.x + player.width && e.x + e.width > player.x &&
       e.y < player.y + player.height && e.y + e.height > player.y) {
      enemies.splice(j,1);
      lives -= 1;
    }
    // Colisão com balas
    bullets.forEach((b,k) => {
      if(b.x < e.x + e.width && b.x + b.width > e.x &&
         b.y < e.y + e.height && b.y + b.height > e.y) {
        enemies.splice(j,1);
        bullets.splice(k,1);
        score += 10;
      }
    });
    // Perde vida se inimigo passar
    if(e.y > canvas.height) {
      enemies.splice(j,1);
      lives -= 1;
    }
  });

  drawPlayer();
  drawBullets();
  drawEnemies();
  drawUI();

  if(lives > 0) requestAnimationFrame(update);
  else {
    ctx.fillStyle = 'white';
    ctx.font = '40px Arial';
    ctx.fillText('Game Over', 200, 200);
  }
}

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft' && player.x > 0) player.x -= player.speed;
  if(e.key === 'ArrowRight' && player.x + player.width < canvas.width) player.x += player.speed;
  if(e.key === ' ') bullets.push({ x:player.x+15, y:player.y, width:10, height:20 });
});

update();
</script>
</body>
</html>
