<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Fashion | Premium Store 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000;
            --secondary: #666;
            --bg: #f4f5f7;
            --card-bg: #ffffff;
            --accent: #2ecc71;
            --header-bg: rgba(255, 255, 255, 0.75);
            --text: #000;
            --border: rgba(0,0,0,0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        body.dark-theme {
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --primary: #ffffff;
            --secondary: #a0a0a0;
            --header-bg: rgba(15, 15, 15, 0.8);
            --text: #ffffff;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); transition: 0.3s; overflow-x: hidden; }

        /* Header Glassmorphism */
        header {
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            background: var(--header-bg); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border);
        }

        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -1px; cursor: pointer; }

        .btn-icon { 
            background: var(--primary); color: var(--bg); border: none; 
            padding: 10px 18px; border-radius: 50px; cursor: pointer; 
            font-weight: 600; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }

        #cartCount { background: #ff3e3e; color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; }

        /* Carrinho Lateral */
        #cartDrawer {
            position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100%;
            background: var(--card-bg); z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.2); padding: 30px; display: flex; flex-direction: column;
        }
        #cartDrawer.active { right: 0; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin-top: 20px; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .cart-item img { width: 70px; height: 70px; border-radius: 12px; object-fit: cover; }

        /* Cards e Efeitos */
        .product-card { 
            background: var(--card-bg); border-radius: 24px; overflow: hidden; border: 1px solid var(--border);
            transition: 0.4s; display: flex; flex-direction: column; position: relative;
        }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
        
        /* Shimmer Effect */
        .product-card::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.6s;
        }
        .product-card:hover::after { left: 100%; }

        .img-container { height: 300px; overflow: hidden; cursor: pointer; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; }

        .btn-heart {
            position: absolute; top: 15px; right: 15px; background: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 10;
            display: flex; align-items: center; justify-content: center; color: #ccc; box-shadow: var(--shadow);
        }
        .btn-heart.active { color: #ff3e3e; }

        /* Filtros e Busca */
        .controls-wrapper { padding: 0 5%; max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .sort-select { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); outline: none; }

        /* Toast Notification */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--primary); color: var(--bg); padding: 12px 30px; border-radius: 50px;
            font-weight: 600; transition: 0.4s; z-index: 3000; opacity: 0;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Modal de Detalhes */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2500; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); width: 90%; max-width: 800px; border-radius: 30px;
            display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; position: relative;
        }
        @media (max-width: 600px) { .modal-content { grid-template-columns: 1fr; } }

        footer { text-align: center; padding: 60px; color: var(--secondary); border-top: 1px solid var(--border); margin-top: 100px; }
    </style>
</head>
<body>

<div id="toast">Item adicionado com sucesso! 🚀</div>
<div id="overlay" onclick="toggleCart()"></div>

<div id="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modalImg" style="height: 100%; min-height: 300px; background-size: cover; background-position: center;"></div>
        <div style="padding: 40px; display: flex; flex-direction: column; gap: 20px;">
            <h2 id="modalTitle">Nome do Produto</h2>
            <p id="modalDesc" style="color: var(--secondary);">Descrição detalhada aqui...</p>
            <div class="product-price" id="modalPrice" style="font-size: 2rem;"></div>
            <div>
                <p style="margin-bottom: 10px; font-weight: 600;">Selecione o Tamanho:</p>
                <div style="display: flex; gap: 10px;" id="sizeList"></div>
            </div>
            <button class="btn-add" id="modalAddBtn" style="width: 100%; padding: 18px;">Adicionar ao Carrinho</button>
            <button onclick="closeModal()" style="background: none; border: none; cursor: pointer; color: var(--secondary);">Fechar</button>
        </div>
    </div>
</div>

<header>
    <div class="logo" onclick="window.scrollTo({top:0, behavior:'smooth'})">SAMUEL FASHION</div>
    <div class="header-actions">
        <button class="btn-icon" id="themeToggle" onclick="toggleTheme()" style="background:none; border:1px solid var(--border); color:var(--text)">🌓</button>
        <button class="btn-icon" onclick="toggleCart()">
            <span>🛒</span>
            <span id="cartCount">0</span>
        </button>
    </div>
</header>

<div id="cartDrawer">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px;">
        <h2>Meu Carrinho</h2>
        <button onclick="toggleCart()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text)">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total">
        <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
            <span>Total:</span>
            <span id="cartTotal">R$ 0,00</span>
        </div>
        <button class="btn-add" style="width: 100%;" onclick="alert('Pedido enviado para o sistema!')">Finalizar Compra</button>
    </div>
</div>

<section class="hero">
    <h1>Estilo Premium 2026</h1>
    <div class="controls-wrapper">
        <input type="text" id="searchInput" placeholder="Busque por marca, cor ou modelo...">
        <div style="display: flex; gap: 15px; align-items: center;">
            <span>Ordenar:</span>
            <select id="sortOrder" class="sort-select" onchange="render()">
                <option value="default">Relevância</option>
                <option value="price-asc">Menor Preço</option>
                <option value="price-desc">Maior Preço</option>
            </select>
        </div>
    </div>
</section>

<div class="filters-container" id="filterContainer">
    <button class="filter-btn active" data-filter="todos">Todos</button>
    <button class="filter-btn" data-filter="nike">Nike</button>
    <button class="filter-btn" data-filter="adidas">Adidas</button>
    <button class="filter-btn" data-filter="lacoste">Lacoste</button>
    <button class="filter-btn" data-filter="penalty">Penalty</button>
    <button class="filter-btn" data-filter="shein">Shein</button>
</div>

<main id="mainContainer">
    </main>

<footer>
    <p>© 2026 Samuel Fashion Store. Design por IA. Todos os direitos reservados.</p>
</footer>

<script>
    const produtos = [
        { id: 1, marca: 'nike', titulo: "Air Force Branco", preco: 759.99, img: "https://imgnike-a.akamaihd.net/768x768/01113751A2.jpg", desc: "O clássico dos clássicos. Couro legítimo e amortecimento Air.", sizes: [38, 39, 40, 41], keywords: "tenis casual" },
        { id: 2, marca: 'nike', titulo: "Moletom Sportswear", preco: 284.99, img: "https://imgnike-a.akamaihd.net/1024x1024/0957727TA2.jpg", desc: "Conforto absoluto para dias frios.", sizes: ['P', 'M', 'G'], keywords: "blusa frio" },
        { id: 3, marca: 'nike', titulo: "Dunk Low 'Panda'", preco: 854.99, img: "https://imgnike-a.akamaihd.net/1920x1920/05847553A2.jpg", desc: "O ícone da cultura sneaker atual.", sizes: [37, 38, 40, 42], keywords: "retro preto branco" },
        { id: 5, marca: 'adidas', titulo: "Ultraboost 5", preco: 1099.99, img: "https://assets.adidas.com/images/w_600,f_auto,q_auto/a284c05789e64be281506dbda3204ed0_9366/Tenis_Ultraboost_5_Turquesa_JQ2911_HM1.jpg", desc: "Retorno de energia incrível para sua corrida.", sizes: [39, 40, 41, 42], keywords: "esporte azul" },
        { id: 8, marca: 'lacoste', titulo: "Polo Original L1212", preco: 699.00, img: "https://imagesa1.lacoste.com/dw/image/v2/BCWL_PRD/on/demandware.static/-/Sites-master/default/dwc5ccbfaf/L1212_HBP_24.jpg?imwidth=960", desc: "Elegância francesa desde 1933.", sizes: [2, 3, 4, 5], keywords: "casual luxo" },
        { id: 12, marca: 'shein', titulo: "Vestido Floral", preco: 159.99, img: "https://images.unsplash.com/photo-1572804013307-a9a11117bb41?auto=format&fit=crop&w=400&q=80", desc: "Leve e fluido para o verão.", sizes: ['PP', 'P', 'M'], keywords: "feminino moda" }
    ];

    let carrinho = JSON.parse(localStorage.getItem('cart_data_v2')) || [];

    function render() {
        const container = document.getElementById('mainContainer');
        const sortVal = document.getElementById('sortOrder').value;
        container.innerHTML = '';

        // Ordenação
        let produtosFiltrados = [...produtos];
        if(sortVal === 'price-asc') produtosFiltrados.sort((a,b) => a.preco - b.preco);
        if(sortVal === 'price-desc') produtosFiltrados.sort((a,b) => b.preco - a.preco);

        const marcas = [...new Set(produtos.map(p => p.marca))];
        
        marcas.forEach(marca => {
            const section = document.createElement('section');
            section.className = 'brand-section';
            section.setAttribute('data-brand', marca);
            section.innerHTML = `<h2 class="section-title" style="margin: 40px 5% 20px;">${marca.toUpperCase()} Collection</h2><div class="product-grid" id="grid-${marca}" style="padding: 0 5%;"></div>`;
            container.appendChild(section);

            const grid = document.getElementById(`grid-${marca}`);
            produtosFiltrados.filter(p => p.marca === marca).forEach(p => {
                grid.innerHTML += `
                    <article class="product-card" data-keywords="${p.keywords} ${p.marca} ${p.titulo}">
                        <button class="btn-heart" onclick="this.classList.toggle('active')">❤</button>
                        <div class="img-container" onclick="openModal(${p.id})">
                            <img src="${p.img}" alt="${p.titulo}">
                        </div>
                        <div class="product-info">
                            <small style="color:var(--secondary)">${p.marca.toUpperCase()}</small>
                            <h3 style="cursor:pointer" onclick="openModal(${p.id})">${p.titulo}</h3>
                            <div class="product-price">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
                            <button class="btn-add" onclick="addToCart(${p.id})">Adicionar</button>
                        </div>
                    </article>`;
            });
        });
        updateCartUI();
    }

    function addToCart(id) {
        const prod = produtos.find(p => p.id === id);
        const itemExistente = carrinho.find(item => item.id === id);

        if(itemExistente) {
            itemExistente.qtd += 1;
        } else {
            carrinho.push({...prod, qtd: 1});
        }

        localStorage.setItem('cart_data_v2', JSON.stringify(carrinho));
        updateCartUI();
        showToast(`Adicionado: ${prod.titulo}`);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function updateCartUI() {
        const container = document.getElementById('cartItems');
        container.innerHTML = '';
        let total = 0;
        let count = 0;

        carrinho.forEach((item, index) => {
            total += (item.preco * item.qtd);
            count += item.qtd;
            container.innerHTML += `
                <div class="cart-item">
                    <img src="${item.img}">
                    <div style="flex-grow:1">
                        <div style="font-weight:600">${item.titulo}</div>
                        <div style="color:var(--secondary)">Qtd: ${item.qtd}</div>
                        <div style="color:var(--accent); font-weight:800">R$ ${(item.preco * item.qtd).toFixed(2)}</div>
                    </div>
                    <button onclick="removeFromCart(${index})" style="border:none; background:none; cursor:pointer;">🗑️</button>
                </div>`;
        });
        document.getElementById('cartCount').innerText = count;
        document.getElementById('cartTotal').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function removeFromCart(index) {
        if(carrinho[index].qtd > 1) {
            carrinho[index].qtd -= 1;
        } else {
            carrinho.splice(index, 1);
        }
        localStorage.setItem('cart_data_v2', JSON.stringify(carrinho));
        updateCartUI();
    }

    // Modal Logic
    function openModal(id) {
        const p = produtos.find(prod => prod.id === id);
        document.getElementById('modalTitle').innerText = p.titulo;
        document.getElementById('modalDesc').innerText = p.desc;
        document.getElementById('modalPrice').innerText = `R$ ${p.preco.toFixed(2)}`;
        document.getElementById('modalImg').style.backgroundImage = `url(${p.img})`;
        
        const sizes = document.getElementById('sizeList');
        sizes.innerHTML = '';
        p.sizes.forEach(s => {
            sizes.innerHTML += `<span style="padding: 8px 15px; border: 1px solid var(--border); border-radius: 8px; cursor:pointer;">${s}</span>`;
        });

        document.getElementById('modalAddBtn').onclick = () => { addToCart(id); closeModal(); };
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function toggleCart(forceOpen = false) {
        const drawer = document.getElementById('cartDrawer');
        if(forceOpen) drawer.classList.add('active');
        else drawer.classList.toggle('active');
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-theme');
        localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
    }

    // Filtros
    document.getElementById('filterContainer').addEventListener('click', (e) => {
        if(e.target.classList.contains('filter-btn')) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            const filter = e.target.getAttribute('data-filter');
            document.querySelectorAll('.brand-section').forEach(s => {
                s.style.display = (filter === 'todos' || s.getAttribute('data-brand') === filter) ? 'block' : 'none';
            });
        }
    });

    if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');
    render();
</script>
</body>
</html>
