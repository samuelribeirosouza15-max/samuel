<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo - Satélite Zoom</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Reset básico para não ter erro de tela */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Interface por cima do mapa */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            pointer-events: none; /* Deixa você clicar no mapa por baixo */
        }

        h1 {
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            font-size: 2.5rem;
        }

        .status {
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 5px 15px;
            border-radius: 20px;
            font-family: monospace;
            display: inline-block;
            margin-top: 10px;
            border: 1px solid #00ff00;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Olá, Mundo!</h1>
        <div class="status">SISTEMA DE SATÉLITE ONLINE</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializa o mapa focado em uma área com casas (Ex: Copacabana, Rio)
        // [Latitude, Longitude], Zoom (18 é bem perto)
        var map = L.map('map', {
            zoomControl: false // Remove os botões de + e - para ficar mais limpo
        }).setView([-22.9711, -43.1845], 18);

        // 2. Adiciona a camada de satélite de ALTA RESOLUÇÃO (Esri)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Imagery © Esri'
        }).addTo(map);

        // 3. Adiciona um marcador no centro
        L.marker([-22.9711, -43.1845]).addTo(map)
            .bindPopup('<b>Foco do Satélite</b><br>Arraste para explorar as ruas.')
            .openPopup();

        // 4. Correção de bug de carregamento inicial
        setTimeout(function(){ 
            map.invalidateSize(); 
        }, 500);
    </script>
</body>
</html>
