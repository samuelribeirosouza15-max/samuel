<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globo Terrestre 3D CSS</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Container do Globo */
        .globo {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            position: relative;
            
            /* Imagem do Mapa */
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Earthmap1000x500compac.jpg/1024px-Earthmap1000x500compac.jpg');
            background-size: cover;
            
            /* Sombra interna para dar efeito de volume */
            box-shadow: inset 20px -20px 50px rgba(0,0,0,0.8), 
                        inset -5px 5px 20px rgba(255,255,255,0.2),
                        0 0 50px rgba(0, 80, 255, 0.2);
            
            /* Animação de rotação */
            animation: rodar 15s linear infinite;
        }

        /* Brilho atmosférico ao redor */
        .globo::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(70, 130, 255, 0.3);
            pointer-events: none;
        }

        @keyframes rodar {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 630px 0; /* Ajuste baseado na largura do mapa */
            }
        }
    </style>
</head>
<body>

    <div class="globo"></div>

</body>
</html>
