<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo - Terra via Satélite</title>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none; /* Permite clicar no globo por baixo do texto */
        }

        h1 {
            margin: 0;
            font-size: 3rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        #globeViz {
            cursor: move;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Olá, Mundo!</h1>
        <p>Interaja com o planeta para explorar a visão de satélite.</p>
    </div>

    <div id="globeViz"></div>

    <script>
        // Configuração do Globo
        const world = Globe()
            (document.getElementById('globeViz'))
            // Textura de Satélite (Imagens reais da NASA/Blue Marble)
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            // Textura de elevação/ relevo para dar profundidade
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            // Imagem das luzes noturnas (aparece se você mudar a textura)
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('lightskyblue')
            .atmosphereAltitude(0.15);

        // Ajusta o tamanho do globo ao redimensionar a janela
        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });

        // Auto-rotação suave
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;
    </script>
</body>
</html>
