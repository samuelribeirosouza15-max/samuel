<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo - Globo 3D</title>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { 
            margin: 0; 
            background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
            color: white; 
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; /* Impede barras de rolagem */
        }

        #interface {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 100;
            pointer-events: none; /* Deixa o mouse passar para o globo */
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }

        p {
            font-size: 1.2rem;
            color: #aaa;
        }

        /* Container do Globo */
        #globo-3d {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="interface">
        <h1>Olá, Mundo!</h1>
        <p>Arraste para girar • Scroll para zoom</p>
    </div>

    <div id="globo-3d"></div>

    <script>
        // Inicializa o globo no elemento 'globo-3d'
        const meuGlobo = Globe()
            (document.getElementById('globo-3d'))
            // Textura da superfície (Visão de Satélite)
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            // Textura das luzes noturnas (opcional)
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#4da6ff')
            .atmosphereAltitude(0.15);

        // Configurações de movimento
        meuGlobo.controls().autoRotate = true;
        meuGlobo.controls().autoRotateSpeed = 0.7;
        
        // Ajusta o tamanho se a janela mudar
        window.addEventListener('resize', () => {
            meuGlobo.width(window.innerWidth);
            meuGlobo.height(window.innerHeight);
        });
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo - Satélite Real</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Garante que o mapa ocupe a tela toda */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        #mensagem {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 15px 25px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid #00ff00;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="mensagem">
        <h2 style="margin:0">SISTEMA ATIVO: OLÁ MUNDO</h2>
        <p style="margin:5px 0 0 0; font-size: 12px;">Aproximando zoom nas coordenadas...</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inicializa o mapa focado em um estádio famoso (Maracanã) para testar o detalhe das casas/ruas
        // Latitude: -22.9121, Longitude: -43.2302, Zoom: 18 (muito perto)
        var map = L.map('map').setView([-22.9121, -43.2302], 18);

        // Camada de Satélite da Esri (Alta Resolução)
        var satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Imagery © Esri',
            maxZoom: 19
        }).addTo(map);

        // Adiciona um marcador para confirmar que o script rodou
        L.marker([-22.9121, -43.2302]).addTo(map)
            .bindPopup('<b>Olá Mundo!</b><br>Aqui estão as casas.')
            .openPopup();

        // Força o redimensionamento para evitar bugs de tela cinza
        setTimeout(function(){ map.invalidateSize()}, 500);
    </script>
</body>
</html>
