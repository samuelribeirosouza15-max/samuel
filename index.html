<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora com Teclado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .calculadora {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 280px;
        }

        .display {
            width: 100%;
            height: 50px;
            font-size: 2em;
            text-align: right;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f1f1f1;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .botões {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .botão {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.5em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .botão:hover {
            background-color: #2980b9;
        }

        .botão-igual {
            background-color: #2ecc71;
        }

        .botão-igual:hover {
            background-color: #27ae60;
        }

        .botão-clear {
            background-color: #e74c3c;
        }

        .botão-clear:hover {
            background-color: #c0392b;
        }

        .botão-apagar {
            background-color: #f39c12;
        }

        .botão-apagar:hover {
            background-color: #e67e22;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <input type="text" class="display" id="display" disabled>
        <div class="botões">
            <button class="botão botão-clear" onclick="clearDisplay()">C</button>
            <button class="botão" onclick="appendToDisplay('7')">7</button>
            <button class="botão" onclick="appendToDisplay('8')">8</button>
            <button class="botão" onclick="appendToDisplay('9')">9</button>
            <button class="botão" onclick="appendToDisplay('/')">/</button>
            <button class="botão" onclick="appendToDisplay('4')">4</button>
            <button class="botão" onclick="appendToDisplay('5')">5</button>
            <button class="botão" onclick="appendToDisplay('6')">6</button>
            <button class="botão" onclick="appendToDisplay('*')">*</button>
            <button class="botão" onclick="appendToDisplay('1')">1</button>
            <button class="botão" onclick="appendToDisplay('2')">2</button>
            <button class="botão" onclick="appendToDisplay('3')">3</button>
            <button class="botão" onclick="appendToDisplay('-')">-</button>
            <button class="botão" onclick="appendToDisplay('0')">0</button>
            <button class="botão" onclick="appendToDisplay('.')">.</button>
            <button class="botão botão-igual" onclick="calculate()">=</button>
            <button class="botão" onclick="appendToDisplay('+')">+</button>
            <button class="botão-apagar" onclick="backspace()">←</button>
        </div>
    </div>

    <script>
        // Adiciona valores ao visor
        function appendToDisplay(value) {
            document.getElementById('display').value += value;
        }

        // Limpa o visor
        function clearDisplay() {
            document.getElementById('display').value = '';
        }

        // Realiza o cálculo
        function calculate() {
            let display = document.getElementById('display');
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Erro';
            }
        }

        // Apaga o último número/valor do visor
        function backspace() {
            let display = document.getElementById('display');
            display.value = display.value.slice(0, -1); // Remove o último caractere
        }

        // Permite a interação com o teclado
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key >= 0 && key <= 9) {
                appendToDisplay(key);  // Digita números de 0 a 9
            } else if (key === '+') {
                appendToDisplay('+');
            } else if (key === '-') {
                appendToDisplay('-');
            } else if (key === '*') {
                appendToDisplay('*');
            } else if (key === '/') {
                appendToDisplay('/');
            } else if (key === '.') {
                appendToDisplay('.');
            } else if (key === 'Enter') {
                calculate();  // Calcula com a tecla Enter
            } else if (key === 'Backspace') {
                backspace();  // Apaga o último número com Backspace
            } else if (key === 'Escape') {
                clearDisplay();  // Limpa a tela com a tecla Escape
            }
        });
    </script>

</body>
</html>
