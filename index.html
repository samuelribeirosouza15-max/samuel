<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Zombies Advanced Shooter</title>
<style>
  body { margin:0; overflow:hidden; background:#111; font-family:sans-serif; }
  #gameCanvas { display:block; margin:0 auto; background:#222; }
  #hud { position:absolute; top:10px; left:10px; color:white; font-size:20px; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="500"></canvas>
<div id="hud">Pontuação: 0 | Vidas: 5 | Arma: Pistola | Munição: ∞</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

// --- PLAYER ---
let player = { x:400, y:250, radius:20, speed:5, lives:5 };

// --- WEAPONS ---
const weapons = {
  pistola: { cooldown:15, damage:10, bullets:1 },
  rifle: { cooldown:30, damage:25, bullets:1 },
  shotgun: { cooldown:45, damage:15, bullets:3 }
};
let currentWeapon = 'pistola';
let fireCooldown = 0;

// --- GAME STATE ---
let bullets = [];
let zombies = [];
let powerUps = [];
let score = 0;
let keys = {};
let mouse = { x:0, y:0, down:false };
let zombieTypes = [
  { type:'comum', speed:1.5, radius:15, color:'green', life:1 },
  { type:'rapido', speed:2.5, radius:12, color:'lime', life:1 },
  { type:'resistente', speed:1, radius:20, color:'darkgreen', life:3 }
];

// --- SPAWN ZOMBIES ---
function spawnZombie() {
  const edges = ['top','bottom','left','right'];
  let edge = edges[Math.floor(Math.random()*edges.length)];
  let x, y;
  if(edge==='top'){ x=Math.random()*canvas.width; y=0; }
  if(edge==='bottom'){ x=Math.random()*canvas.width; y=canvas.height; }
  if(edge==='left'){ x=0; y=Math.random()*canvas.height; }
  if(edge==='right'){ x=canvas.width; y=Math.random()*canvas.height; }
  let zType = zombieTypes[Math.floor(Math.random()*zombieTypes.length)];
  zombies.push({ 
    x:x, y:y, radius:zType.radius, speed:zType.speed, color:zType.color, life:zType.life
  });
}
setInterval(spawnZombie, 1000);

// --- SPAWN POWER-UPS ---
function spawnPowerUp() {
  let x = Math.random()*(canvas.width-20);
  let y = Math.random()*(canvas.height-20);
  const types = ['vida','dano','velocidade'];
  powerUps.push({x:x, y:y, radius:10, type:types[Math.floor(Math.random()*types.length)], duration:500});
}
setInterval(spawnPowerUp, 15000);

// --- DRAW ---
function drawPlayer() {
  ctx.fillStyle='cyan';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
  ctx.fill();
}
function drawBullets() {
  ctx.fillStyle='yellow';
  bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,b.radius,0,Math.PI*2); ctx.fill(); });
}
function drawZombies() {
  zombies.forEach(z=>{
    ctx.fillStyle = z.color;
    ctx.beginPath();
    ctx.arc(z.x,z.y,z.radius,0,Math.PI*2);
    ctx.fill();
  });
}
function drawPowerUps() {
  powerUps.forEach(p=>{
    ctx.fillStyle = p.type==='vida'?'red':p.type==='dano'?'orange':'blue';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fill();
  });
}

// --- FIRE ---
function fireWeapon() {
  if(fireCooldown<=0 && mouse.down){
    let w = weapons[currentWeapon];
    let dx = mouse.x - player.x;
    let dy = mouse.y - player.y;
    let angle = Math.atan2(dy, dx);
    if(currentWeapon==='shotgun'){
      for(let i=-1;i<=1;i++){
        bullets.push({ 
          x:player.x, y:player.y, radius:5, dx: Math.cos(angle + i*0.1)*7, dy: Math.sin(angle + i*0.1)*7, damage:w.damage 
        });
      }
    } else {
      bullets.push({ x:player.x, y:player.y, radius:5, dx: Math.cos(angle)*7, dy: Math.sin(angle)*7, damage:w.damage });
    }
    fireCooldown = w.cooldown;
  }
}

// --- UPDATE ---
function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  fireCooldown--;

  // MOVE BULLETS
  bullets.forEach((b,i)=>{
    b.x += b.dx; b.y += b.dy;
    if(b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height) bullets.splice(i,1);
  });

  // MOVE ZOMBIES
  zombies.forEach((z,j)=>{
    let dx = player.x - z.x;
    let dy = player.y - z.y;
    let dist = Math.sqrt(dx*dx+dy*dy);
    z.x += (dx/dist)*z.speed;
    z.y += (dy/dist)*z.speed;

    // Collision with player
    if(dist<z.radius+player.radius){
      zombies.splice(j,1);
      player.lives -=1;
    }

    // Collision with bullets
    bullets.forEach((b,k)=>{
      let d = Math.sqrt((b.x-z.x)**2 + (b.y-z.y)**2);
      if(d<z.radius+b.radius){
        z.life -= b.damage/10;
        bullets.splice(k,1);
        if(z.life<=0){
          zombies.splice(j,1);
          score += 10;
        }
      }
    });
  });

  // POWER UPS
  powerUps.forEach((p,i)=>{
    let d = Math.sqrt((player.x-p.x)**2 + (player.y-p.y)**2);
    if(d<player.radius+p.radius){
      if(p.type==='vida') player.lives +=1;
      if(p.type==='dano') weapons[currentWeapon].damage +=5;
      if(p.type==='velocidade') { player.speed +=2; setTimeout(()=>player.speed-=2,5000); }
      powerUps.splice(i,1);
    }
  });

  // DRAW
  drawPlayer();
  drawBullets();
  drawZombies();
  drawPowerUps();

  // HUD
  hud.innerText=`Pontuação: ${score} | Vidas: ${player.lives} | Arma: ${currentWeapon.charAt(0).toUpperCase()+currentWeapon.slice(1)} | Munição: ∞`;

  fireWeapon();
  if(player.lives>0) requestAnimationFrame(update);
  else { ctx.fillStyle='white'; ctx.font='50px Arial'; ctx.fillText('GAME OVER', canvas.width/2-150, canvas.height/2); }
}

// --- CONTROLS ---
document.addEventListener('keydown', e=>keys[e.key]=true);
document.addEventListener('keyup', e=>keys[e.key]=false);

document.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
document.addEventListener('mousedown', e=>mouse.down=true);
document.addEventListener('mouseup', e=>mouse.down=false);

function handleMovement(){
  if(keys['w'] && player.y-player.radius>0) player.y -= player.speed;
  if(keys['s'] && player.y+player.radius<canvas.height) player.y += player.speed;
  if(keys['a'] && player.x-player.radius>0) player.x -= player.speed;
  if(keys['d'] && player.x+player.radius<canvas.width) player.x += player.speed;
  if(keys['1']) currentWeapon='pistola';
  if(keys['2']) currentWeapon='rifle';
  if(keys['3']) currentWeapon='shotgun';
  requestAnimationFrame(handleMovement);
}

handleMovement();
update();
</script>
</body>
</html>
<!-- HTML -->
<div id="buttons">
  <button id="up">⬆️</button>
  <button id="down">⬇️</button>
  <button id="left">⬅️</button>
  <button id="right">➡️</button>
  <button id="shoot">💥</button>
</div>

<style>
#buttons {
  position:absolute; bottom:10px; width:100%; display:flex; justify-content:space-between; padding:10px;
}
  <script>
// --- CONTROLS ---
// Alterar as teclas de movimento para as setas
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') keys['up'] = true;
  if (e.key === 'ArrowDown') keys['down'] = true;
  if (e.key === 'ArrowLeft') keys['left'] = true;
  if (e.key === 'ArrowRight') keys['right'] = true;
  if (e.key === '1') currentWeapon = 'pistola';
  if (e.key === '2') currentWeapon = 'rifle';
  if (e.key === '3') currentWeapon = 'shotgun';
});

document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') keys['up'] = false;
  if (e.key === 'ArrowDown') keys['down'] = false;
  if (e.key === 'ArrowLeft') keys['left'] = false;
  if (e.key === 'ArrowRight') keys['right'] = false;
});

document.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
document.addEventListener('mousedown', e => mouse.down = true);
document.addEventListener('mouseup', e => mouse.down = false);

function handleMovement() {
  if (keys['up'] && player.y - player.radius > 0) player.y -= player.speed;
  if (keys['down'] && player.y + player.radius < canvas.height) player.y += player.speed;
  if (keys['left'] && player.x - player.radius > 0) player.x -= player.speed;
  if (keys['right'] && player.x + player.radius < canvas.width) player.x += player.speed;
  requestAnimationFrame(handleMovement);
}

handleMovement();

// Botões de movimento no HTML
document.getElementById('up').addEventListener('click', () => { if (player.y - player.radius > 0) player.y -= player.speed; });
document.getElementById('down').addEventListener('click', () => { if (player.y + player.radius < canvas.height) player.y += player.speed; });
document.getElementById('left').addEventListener('click', () => { if (player.x - player.radius > 0) player.x -= player.speed; });
document.getElementById('right').addEventListener('click', () => { if (player.x + player.radius < canvas.width) player.x += player.speed; });

document.getElementById('shoot').addEventListener('click', () => mouse.down = true);
</script>
#buttons button {
  width:60px; height:60px; font-size:24px; opacity:0.7; border:none; border-radius:10px;
}
</style>
