<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Repulsiva</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #FF5733; /* cor de fundo exagerada */
        }

        .calculadora {
            background-color: #FFF000; /* Cor muito chamativa */
            padding: 50px;
            border-radius: 0px; /* Sem bordas arredondadas */
            box-shadow: 10px 10px 30px #000000;
            width: 350px;
            border: 5px solid #FF0000; /* Borda vermelha grossa */
        }

        .display {
            width: 100%;
            height: 80px;
            font-size: 3em; /* Tamanho de fonte excessivo */
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #FFFF00; /* Amarelo neon */
            border: 2px dashed #FF0000; /* Borda vermelha e pontilhada */
            border-radius: 15px;
        }

        .botões {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .botão {
            background-color: #00FF00; /* Verde neon */
            color: black;
            border: none;
            padding: 30px;
            font-size: 2.5em; /* Fonte maior e desconfortável */
            border-radius: 20px; /* Borda bem arredondada */
            cursor: pointer;
            transition: transform 0.2s;
        }

        .botão:hover {
            background-color: #FF00FF; /* Mudança para rosa neon */
            transform: scale(1.2); /* Efeito de zoom exagerado */
        }

        .botão-igual {
            background-color: #FF00FF; /* Neon Pink */
        }

        .botão-igual:hover {
            background-color: #00FFFF; /* Neon Azul */
        }

        .botão-clear {
            background-color: #FF0000; /* Vermelho forte */
        }

        .botão-clear:hover {
            background-color: #FF9900; /* Laranja forte */
        }

        /* Tecla de Apagar em uma cor berrante */
        .botão-apagar {
            background-color: #FF1493; /* Rosa intenso */
        }

        .botão-apagar:hover {
            background-color: #8A2BE2; /* Roxo brilhante */
        }

        /* Pequenos ajustes para o teclado ser "desagradável" */
        button:active {
            transform: scale(0.8);
            background-color: #0000FF;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <input type="text" class="display" id="display" disabled>
        <div class="botões">
            <button class="botão botão-clear" onclick="clearDisplay()">C</button>
            <button class="botão" onclick="appendToDisplay('7')">7</button>
            <button class="botão" onclick="appendToDisplay('8')">8</button>
            <button class="botão" onclick="appendToDisplay('9')">9</button>
            <button class="botão" onclick="appendToDisplay('/')">/</button>
            <button class="botão" onclick="appendToDisplay('4')">4</button>
            <button class="botão" onclick="appendToDisplay('5')">5</button>
            <button class="botão" onclick="appendToDisplay('6')">6</button>
            <button class="botão" onclick="appendToDisplay('*')">*</button>
            <button class="botão" onclick="appendToDisplay('1')">1</button>
            <button class="botão" onclick="appendToDisplay('2')">2</button>
            <button class="botão" onclick="appendToDisplay('3')">3</button>
            <button class="botão" onclick="appendToDisplay('-')">-</button>
            <button class="botão" onclick="appendToDisplay('0')">0</button>
            <button class="botão" onclick="appendToDisplay('.')">.</button>
            <button class="botão botão-igual" onclick="calculate()">=</button>
            <button class="botão" onclick="appendToDisplay('+')">+</button>
            <button class="botão-apagar" onclick="backspace()">←</button>
        </div>
    </div>

    <script>
        // Adiciona valores ao visor
        function appendToDisplay(value) {
            document.getElementById('display').value += value;
        }

        // Limpa o visor
        function clearDisplay() {
            document.getElementById('display').value = '';
        }

        // Realiza o cálculo
        function calculate() {
            let display = document.getElementById('display');
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Erro';
            }
        }

        // Apaga o último número/valor do visor
        function backspace() {
            let display = document.getElementById('display');
            display.value = display.value.slice(0, -1); // Remove o último caractere
        }

        // Permite a interação com o teclado
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key >= 0 && key <= 9) {
                appendToDisplay(key);  // Digita números de 0 a 9
            } else if (key === '+') {
                appendToDisplay('+');
            } else if (key === '-') {
                appendToDisplay('-');
            } else if (key === '*') {
                appendToDisplay('*');
            } else if (key === '/') {
                appendToDisplay('/');
            } else if (key === '.') {
                appendToDisplay('.');
            } else if (key === 'Enter') {
                calculate();  // Calcula com a tecla Enter
            } else if (key === 'Backspace') {
                backspace();  // Apaga o último número com Backspace
            } else if (key === 'Escape') {
                clearDisplay();  // Limpa a tela com a tecla Escape
            }
        });
    </script>

</body>
</html>
