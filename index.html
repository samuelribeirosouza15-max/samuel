<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja Samuel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">SAMUEL FASHION</div>
    <nav id="menu"><a href="index.html">LOJA</a></nav>
</header>

<div class="container">
    <div class="product-grid" id="grid"></div>
</div>

<script>
    function checkAdmin() {
        const user = JSON.parse(localStorage.getItem('sf_user'));
        if(user && user.email === "admin@samuel.com") {
            document.getElementById('menu').innerHTML += `
                <a href="estoque.html">ESTOQUE</a>
                <a href="financeiro.html">FINANCEIRO</a>`;
        }
    }

    function render() {
        const produtos = JSON.parse(localStorage.getItem('sf_estoque')) || [];
        const grid = document.getElementById('grid');
        
        grid.innerHTML = produtos.map(p => `
            <div class="card">
                <img src="${p.img}">
                <h3>${p.titulo}</h3>
                <p>R$ ${p.preco.toFixed(2)}</p>
                <p><small>Estoque: ${p.qtd}</small></p>
                <button class="btn btn-buy" ${p.qtd <= 0 ? 'disabled' : ''} onclick="comprar(${p.id})">
                    ${p.qtd > 0 ? 'Comprar' : 'Esgotado'}
                </button>
            </div>
        `).join('');
    }

    function comprar(id) {
        let estoque = JSON.parse(localStorage.getItem('sf_estoque'));
        const idx = estoque.findIndex(p => p.id === id);

        if (estoque[idx].qtd > 0) {
            estoque[idx].qtd -= 1;
            localStorage.setItem('sf_estoque', JSON.stringify(estoque));
            
            // Registrar venda
            let vendas = JSON.parse(localStorage.getItem('sf_vendas')) || [];
            vendas.push({ titulo: estoque[idx].titulo, preco: estoque[idx].preco, data: new Date().toLocaleString() });
            localStorage.setItem('sf_vendas', JSON.stringify(vendas));

            alert("Vendido!");
            render();
        }
    }

    checkAdmin();
    render();
</script>
</body>
</html>
