<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Globo 3D estilo Google Earth</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #cesiumContainer { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: new Cesium.IonImageryProvider({ assetId: 2 }), // Satélite
            baseLayerPicker: true,
            terrainProvider: Cesium.createWorldTerrain(), // Terreno real
            shouldAnimate: true
        });

        viewer.scene.globe.enableLighting = true; // Luz do sol
        viewer.scene.globe.depthTestAgainstTerrain = true; 

        // Focar no Brasil ao abrir
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(-47.8822, -15.7942, 5000000)
        });

        // Opções de controle estilo Google Earth
        viewer.scene.screenSpaceCameraController.enableRotate = true;
        viewer.scene.screenSpaceCameraController.enableZoom = true;
        viewer.scene.screenSpaceCameraController.enableTilt = true;
    </script>
</body>
</html>
