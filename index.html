<!DOCTYPE html>
<html lang="pt-br">

    <title>Fashion Hub | Vitrine de Estilo</title>

    <style>
        :root {
            --primary: #000;
            --secondary: #666;
            --bg: #ffffff;
            --card-bg: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg); color: var(--primary); }

        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            background: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }

        .hero {
            padding: 50px 5%;
            text-align: center;
            background: #fff;
        }

        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 800; }

        .search-container {
            max-width: 600px;
            margin: 20px auto 0;
        }

        #searchInput {
            width: 100%;
            padding: 18px 25px;
            border-radius: 12px;
            border: 2px solid #eee;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        #searchInput:focus { border-color: var(--primary); }

            margin: 0 auto;
        }
