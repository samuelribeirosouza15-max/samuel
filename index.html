<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Samuel Fashion | Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">SAMUEL FASHION</div>
    <nav id="menu">
        <a href="index.html">LOJA</a>
        </nav>
    <div id="userArea">
        <button class="btn" style="width:auto; padding:5px 15px" onclick="logout()">Sair</button>
    </div>
</header>

<div class="container">
    <h2 id="welcome">Bem-vindo!</h2>
    <div class="product-grid" id="grid"></div>
</div>

<script>
    // CONFIGURAÇÃO DO ADMIN (Mude aqui o e-mail do patrão)
    const EMAIL_ADMIN = "admin@samuel.com";

    function checkAuth() {
        const user = JSON.parse(localStorage.getItem('sf_user'));
        if (!user) {
            window.location.href = 'login.html'; // Se não tiver logado, vai pro login
            return;
        }

        document.getElementById('welcome').innerText = `Olá, ${user.name}!`;

        // Se for ADMIN, mostra os botões secretos
        if (user.email === EMAIL_ADMIN) {
            const nav = document.getElementById('menu');
            nav.innerHTML += `
                <a href="estoque.html" style="color:var(--accent)">📦 ESTOQUE</a>
                <a href="financeiro.html" style="color:var(--accent)">💰 FINANCEIRO</a>
            `;
        }
    }

    function render() {
        const produtos = JSON.parse(localStorage.getItem('sf_estoque')) || [];
        const grid = document.getElementById('grid');
        
        grid.innerHTML = produtos.map(p => `
            <div class="card">
                <img src="${p.img}">
                <h3>${p.titulo}</h3>
                <p style="color:var(--accent); font-weight:800">R$ ${p.preco.toFixed(2)}</p>
                <p><small>Disponível: ${p.qtd}</small></p>
                <button class="btn btn-buy" ${p.qtd <= 0 ? 'disabled' : ''} onclick="comprar(${p.id})">
                    ${p.qtd > 0 ? 'Comprar' : 'Esgotado'}
                </button>
            </div>
        `).join('');
    }

    function comprar(id) {
        let estoque = JSON.parse(localStorage.getItem('sf_estoque'));
        const idx = estoque.findIndex(p => p.id === id);

        if (estoque[idx].qtd > 0) {
            estoque[idx].qtd -= 1;
            localStorage.setItem('sf_estoque', JSON.stringify(estoque));

            let vendas = JSON.parse(localStorage.getItem('sf_vendas')) || [];
            vendas.push({ titulo: estoque[idx].titulo, preco: estoque[idx].preco, data: new Date().toLocaleString() });
            localStorage.setItem('sf_vendas', JSON.stringify(vendas));

            alert("Sucesso! Item reservado.");
            render();
        }
    }

    function logout() {
        localStorage.removeItem('sf_user');
        window.location.href = 'login.html';
    }

    checkAuth();
    render();
</script>
</body>
</html>
