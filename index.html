<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Globo 3D Interativo</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // Criando o globo
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: Cesium.createWorldTerrain(),
      imageryProvider: new Cesium.IonImageryProvider({ assetId: 3 }), // imagens de satélite
      baseLayerPicker: true
    });

    // Coordenadas da sua casa (exemplo: latitude e longitude)
    const latitude = -23.55052;   // substitua pela sua latitude
    const longitude = -46.633308; // substitua pela sua longitude
    const height = 500; // altura inicial da câmera em metros

    // Move a câmera para a sua casa
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(longitude, latitude, height),
      duration: 3
    });

    // Marcador para sua casa
    viewer.entities.add({
      name: "Minha Casa",
      position: Cesium.Cartesian3.fromDegrees(longitude, latitude, 0),
      point: { pixelSize: 10, color: Cesium.Color.RED }
    });
  </script>
</body>
</html>
