<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globo Satélite 3D Interativo</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            pointer-events: none;
            border: 1px solid #444;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #4af; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Navegador de Satélite 3D</h1>
        <p>• Arraste para girar o globo<br>
           • Use o scroll para buscar sua casa (Zoom)<br>
           • Clique com o botão direito para mover</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Cenário básico
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Criando a Terra com textura de Satélite de alta resolução
        const geometry = new THREE.SphereGeometry(5, 128, 128); // Alta definição na esfera
        const loader = new THREE.TextureLoader();
        
        // Usando o servidor de mapas da Esri para a textura do globo
        const satelliteTexture = loader.load('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/0/0/0.jpg', (texture) => {
            // Tentativa de carregar uma versão de maior escala após o carregamento inicial
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        });

        const material = new THREE.MeshStandardMaterial({ 
            map: loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'), // Base
            bumpScale: 0.05
        });

        // Aplicando a textura de satélite real
        // Nota: Em globos 3D simples, usamos uma imagem estática de alta resolução. 
        // Para zoom infinito nível "casa", o ideal é o mapa plano, mas este globo usa foto real da NASA.
        material.map = loader.load('https://worldwind25.arc.nasa.gov/tiles/curtain.jpg?lastUpdate=1614742415522'); 
        
        const earth = new THREE.Mesh(geometry, material);
        scene.add(earth);

        // Adicionando uma leve atmosfera (brilho azul)
        const atmoGeom = new THREE.SphereGeometry(5.05, 128, 128);
        const atmoMat = new THREE.MeshBasicMaterial({
            color: 0x4488ff,
            transparent: true,
            opacity: 0.1,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmoGeom, atmoMat);
        scene.add(atmosphere);

        // Luzes
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        // Estrelas ao fundo
        const starGeometry = new THREE.BufferGeometry();
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff });

            const y = (Math.random() - 0.5) * 1000;
            const z = (Math.random() - 0.5) * 1000;
            starVertices.push(x, y, z);
