<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Hub | As Melhores Marcas</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; background-color: #f4f4f4; text-align: center; }
        header { background: #000; color: #fff; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .card { 
            background: #fff; border-radius: 10px; margin: 15px; width: 250px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.3s; overflow: hidden;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 150px; object-fit: contain; padding: 10px; }
        .card h3 { font-size: 1.2rem; margin: 10px 0; color: #333; }
        .btn { 
            display: inline-block; padding: 10px 20px; margin-bottom: 15px; 
            background-color: #000; color: #fff; text-decoration: none; border-radius: 5px; 
        }
        .btn:hover { background-color: #444; }
    </style>
</head>
<body>

<header>
    <h1>Moda Masculina & Feminina</h1>
    <p>Sua porta de entrada para as melhores marcas do mundo</p>
</header>

<div class="container">
    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Logo_NIKE.svg" alt="Nike">
        <h3>Nike</h3>
        <a href="https://www.nike.com.br" target="_blank" class="btn">Comprar Agora</a>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Adidas_Logo.svg" alt="Adidas">
        <h3>Adidas</h3>
        <a href="https://www.adidas.com.br" target="_blank" class="btn">Comprar Agora</a>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/9/93/Lacoste_logo.svg/1200px-Lacoste_logo.svg.png" alt="Lacoste">
        <h3>Lacoste</h3>
        <a href="https://www.lacoste.com/br/" target="_blank" class="btn">Comprar Agora</a>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Ralph_Lauren_Logo.svg/1200px-Ralph_Lauren_Logo.svg.png" alt="Ralph Lauren">
        <h3>Ralph Lauren</h3>
        <a href="https://www.ralphlauren.com" target="_blank" class="btn">Comprar Agora</a>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/SHEIN_logo.svg/2560px-SHEIN_logo.svg.png" alt="SHEIN">
        <h3>SHEIN</h3>
        <a href="https://br.shein.com" target="_blank" class="btn">Comprar Agora</a>
    </div>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/pt/d/d4/Puma_Logo.png" alt="Puma">
        <h3>Puma</h3>
        <a href="https://br.puma.com" target="_blank" class="btn">Comprar Agora</a>
    </div>
</div>

</body>
</html>
