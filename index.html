<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Fashion | Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <style>
        /* Reutilize o CSS do bloco anterior aqui */
        :root { --primary: #000; --accent: #10b981; --bg: #f8fafc; --card-bg: #fff; --text: #0f172a; --border: #e2e8f0; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
        body { background: var(--bg); color: var(--text); }
        header { padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; background: #fff; sticky; top:0; z-index:100; border-bottom: 1px solid var(--border); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 2rem 5%; }
        .card { background: #fff; border-radius: 15px; border: 1px solid var(--border); overflow: hidden; padding: 15px; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .btn-buy { width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        nav a { margin-left: 15px; text-decoration: none; color: var(--text); font-weight: 600; font-size: 0.8rem; }
    </style>
</head>
<body>

<header>
    <div class="logo">Samuel Fashion</div>
    <nav>
        <a href="cliente.html">Minha Conta</a>
        <a href="estoque.html">📦 Estoque</a>
        <a href="financeiro.html">💰 Financeiro</a>
    </nav>
</header>

<main class="product-grid" id="grid"></main>

<script>
    // Carrega do estoque ou usa o padrão
    const defaultProds = [{ id: 1, marca: 'nike', titulo: "Air Force 1", preco: 759.99, img: "https://imgnike-a.akamaihd.net/768x768/01113751A2.jpg" }];
    const produtos = JSON.parse(localStorage.getItem('sf_estoque')) || defaultProds;

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = produtos.map(p => `
            <div class="card">
                <img src="${p.img}">
                <h3>${p.titulo}</h3>
                <p>R$ ${p.preco}</p>
                <button class="btn-buy" onclick="comprar(${p.id})">Comprar</button>
            </div>
        `).join('');
    }

    function comprar(id) {
        const p = produtos.find(x => x.id === id);
        let vendas = JSON.parse(localStorage.getItem('sf_vendas')) || [];
        vendas.push({...p, data: new Date().toLocaleDateString()});
        localStorage.setItem('sf_vendas', JSON.stringify(vendas));
        alert("Pedido realizado! Veja no Financeiro.");
    }
    render();
</script>
</body>
</html>
