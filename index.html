        #info {
            position: absolute;

            color: white;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

        <h1>Globo Terrestre 3D</h1>
        <p>Arraste para girar | Scroll para Zoom</p>
    </div>

        }

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Configuração da Cena
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Criando o Globo (Esfera)
        const geometry = new THREE.SphereGeometry(5, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        
        // Textura de Satélite (Blue Marble da NASA)
        const earthTexture = textureLoader.load('https://unpkg.com/threejs-earth@1.0.3/images/earth_color_map.jpg');
        
        const material = new THREE.MeshPhongMaterial({
            map: earthTexture,
            bumpScale: 0.05,
        });

        const earth = new THREE.Mesh(geometry, material);
        scene.add(earth);

        // 3. Iluminação (Simulando o Sol)
        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(5, 3, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x333333));

        }
